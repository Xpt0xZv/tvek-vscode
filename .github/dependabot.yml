version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "security"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      testing:
        patterns:
          - "mocha"
          - "@types/mocha"
          - "@vscode/test-*"
    ignore:
      # typescript-eslint v8 peerDependency requires typescript <6.0.0
      - dependency-name: "typescript"
        versions:
          - ">= 6.0.0"
      # Keep @types/node aligned with our Node 24 Active LTS (.nvmrc) runtime ceiling
      - dependency-name: "@types/node"
        versions:
          - ">= 25.0.0"
