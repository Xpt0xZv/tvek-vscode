name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Linux headless display dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gtk_pkg="libgtk-3-0"
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            gtk_pkg="libgtk-3-0t64"
          fi
          asound_pkg="libasound2"
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            asound_pkg="libasound2t64"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            xauth \
            libgbm1 \
            libnss3 \
            libxss1 \
            libxtst6 \
            "$gtk_pkg" \
            "$asound_pkg"

      - name: Install dependencies deterministically
        shell: bash
        run: npm ci

      - name: Run typecheck and lint
        shell: bash
        run: npm run check

      - name: Build extension bundle
        shell: bash
        run: npm run build

      - name: Stage upstream tvek binary for host runner
        shell: bash
        run: node scripts/fetch-binary.mjs

      - name: Run unit and VS Code E2E tests (Linux Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npm test

      - name: Run unit and VS Code E2E tests (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: npm test

      - name: Dry-run target VSIX packaging and verify contents
        shell: bash
        run: |
          host_target="$(node -e "import('./scripts/fetch-binary.mjs').then(m => process.stdout.write(m.resolveTarget().target))")"
          vsix_path="tvek-vscode-${host_target}-ci.vsix"
          npx --no-install vsce package --no-dependencies --skip-license --target "$host_target" -o "$vsix_path"
          test -s "$vsix_path"
          VSIX_CHECK_PATH="$vsix_path" HOST_TARGET="$host_target" node -e '
            const fs = require("node:fs");
            const yauzl = require("yauzl");
            const vsixPath = process.env.VSIX_CHECK_PATH;
            const target = process.env.HOST_TARGET;
            const expectedBin = target.startsWith("win32-")
              ? "extension/bundled/bin/tvek.exe"
              : "extension/bundled/bin/tvek";
            if (!fs.existsSync(vsixPath) || fs.statSync(vsixPath).size === 0) {
              throw new Error("VSIX file missing or empty: " + vsixPath);
            }
            yauzl.open(vsixPath, { lazyEntries: true }, (err, zip) => {
              if (err) throw err;
              const entries = new Set();
              zip.readEntry();
              zip.on("entry", (entry) => {
                entries.add(entry.fileName);
                zip.readEntry();
              });
              zip.on("end", () => {
                for (const req of ["extension/dist/extension.js", "extension/package.json", expectedBin]) {
                  if (!entries.has(req)) {
                    console.error("Missing required VSIX entry:", req);
                    process.exit(1);
                  }
                }
                for (const name of entries) {
                  if (name.startsWith("extension/node_modules/") || name.startsWith("extension/src/")) {
                    console.error("Unexpected excluded entry inside VSIX:", name);
                    process.exit(1);
                  }
                }
                console.log("Verified VSIX entries (" + entries.size + " total) for " + target);
              });
            });
          '
          rm -f "$vsix_path"
